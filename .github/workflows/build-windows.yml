name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0,<7"

      - name: Compile-check source
        run: python -m py_compile cleanup_tool.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name SteamCleanupTool cleanup_tool.py

      - name: Assemble archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/SteamCleanupTool.exe, config.json, run_cleanup.bat, edit_config.bat, check_config.bat, README.md, README_RU.md, LICENSE -Destination release
          Compress-Archive -Path release/* -DestinationPath SteamCleanupTool-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SteamCleanupTool-Windows
          path: SteamCleanupTool-Windows.zip

      - name: Attach archive to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SteamCleanupTool-Windows.zip
          generate_release_notes: true
